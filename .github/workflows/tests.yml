name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd api
          python -m pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t contractguard-test ./api

  ai-evaluation:
    runs-on: ubuntu-latest
    needs: test
    if: contains(github.event.head_commit.modified, 'api/') || contains(github.event.head_commit.added, 'api/')
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contractguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/contractguard
        run: |
          cd api
          alembic upgrade head
      - name: Run golden dataset evaluation
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/contractguard
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd api
          python run_evaluation.py